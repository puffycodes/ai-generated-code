<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Message - Secure Web Server</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>Submit Message</h1>
        
        <div th:if="${error}" class="error" th:text="${error}"></div>
        
        <form th:action="@{/submit}" th:object="${message}" method="post">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required>
                <div th:if="${#fields.hasErrors('email')}" class="error" th:errors="*{email}"></div>
            </div>
            
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" th:field="*{message}" rows="5" required></textarea>
                <div th:if="${#fields.hasErrors('message')}" class="error" th:errors="*{message}"></div>
            </div>
            
            <button type="submit" class="btn">Submit</button>
        </form>
        
        <a href="/" class="link">Back to Home</a>
    </div>
</body>
</html>
