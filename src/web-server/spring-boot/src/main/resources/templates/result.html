<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Message Submitted</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>Message Submitted</h1>
        <div class="result">
            <p><strong>Email:</strong> <span th:text="${email}"></span></p>
            <p><strong>Message:</strong> <span th:text="${message}"></span></p>
        </div>
        <a href="/submit" class="button">Submit Another Message</a>
        <a href="/" class="home-link">Back to Home</a>
    </div>
</body>
</html>
